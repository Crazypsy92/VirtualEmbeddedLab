name: 问题报告
description: 报告可复现的构建、安装或实验问题
body:
  - type: textarea
    id: environment
    attributes:
      label: 环境与提交
      description: 提供 commit、Ubuntu/WSL 版本、实验后端和 doctor 的相关输出。先删除个人路径或密钥。
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: 验证范围
      options: [Host 或仿真, 真实硬件或 HIL, 未确定]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: 预期行为与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 请仅附经脱敏的最短日志。安全漏洞请按 SECURITY.md 私下报告。
