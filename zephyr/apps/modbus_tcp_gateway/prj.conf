CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_SERIAL=y
# Native PTY async TX bypasses IRQ emulation; 1 ms ticks preserve the RTU deadline margin.
CONFIG_UART_ASYNC_API=y
CONFIG_MODBUS_SERIAL_ASYNC_API=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=n
CONFIG_UART_CONSOLE=n
CONFIG_POSIX_ARCH_CONSOLE=y
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_CLIENT=y
CONFIG_MODBUS_RAW_ADU=y
CONFIG_MODBUS_NUMOF_RAW_ADU=1
CONFIG_MODBUS_FP_EXTENSIONS=n
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_ASSERT=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_ZVFS_POLL_MAX=8
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
